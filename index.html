<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EASEHUB — PG • Laundry • Mess • & More</title>
    <meta name="description" content="EASEHUB connects university students with verified PG & hostel accommodations, doorstep laundry, campus mess, fitness, and student essentials." />
    <meta name="keywords" content="EASEHUB, PG, laundry, mess, student housing, hostel food, campus services" />
    <meta name="theme-color" content="#0F382C" />

    <!-- Open Graph / SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EASEHUB — PG • Laundry • Mess • & More" />
    <meta property="og:description" content="EASEHUB connects university students with verified PG accommodations, laundry, mess & food subscriptions, and campus essentials." />
    <meta property="og:image" content="/easehub-logo-original.png" />

    <!-- Fonts: Plus Jakarta Sans (Sleek Tech & Display), Inter (Clean Body UI) & Outfit (Heroic Geometric) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <link rel="preload" as="image" href="/easehub-mark.png" />
    <link rel="icon" type="image/png" href="/easehub-mark.png" />

    <!-- Google Identity Services SDK for Direct Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root">
      <div id="easehub-instant-loader" style="position:fixed;inset:0;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
        <img src="/easehub-mark.png" alt="EASEHUB" style="width:52px;height:52px;object-fit:contain;animation:ehPulse 1s ease-in-out infinite alternate;" />
        <div style="font-size:13px;font-weight:700;color:#15803D;letter-spacing:0.08em;">EASEHUB</div>
      </div>
      <style>
        @keyframes ehPulse { 0% { transform: scale(0.95); opacity: 0.75; } 100% { transform: scale(1.05); opacity: 1; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
